<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindAnime | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-title">FindAnime</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="anime-list.html">Anime List</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="search-section">
            <form id="search-form" class="search-form">
                <input type="text" id="search-input" placeholder="Search anime by name...">
                <input type="text" id="desc-input" placeholder="Describe the anime you want...">
                <button type="submit">Search</button>
            </form>
        </section>
        <section>
            <h2>Top Anime</h2>
            <div id="top-anime-container" class="anime-grid">
                <!-- Top anime will be loaded here by JavaScript -->
            </div>
        </section>
    </main>
    <div id="modal-overlay" class="hidden">
        <div id="anime-modal" class="modal">
            <!-- Modal content will be injected here -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
